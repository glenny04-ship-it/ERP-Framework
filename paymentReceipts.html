<body>
  <div class="container">
    <div id="prHeader" class="flex flex-space">
      <div><h1>Payment Receipts</h1><h2>Add and manage customer payments</h2></div>
      <button id="prBtnNew"><i class="fa fa-plus"></i> New Payment Receipt</button>
    </div>

    <div class="search-row">
      <select id="prSearchCriteria" class="search-select">
        <option value="All">All</option><option value="PR ID">PR ID</option><option value="Customer Name">Customer Name</option><option value="SI ID">SI ID</option><option value="Invoice Num">Invoice Num</option><option value="PR Status">PR Status</option>
      </select>
      <input id="prSearchInput" class="search-input" placeholder="Search...">
      <button id="prBtnSearch">Search</button><button id="prBtnClear" class="btn-clear">Clear</button>
    </div>

    <table id="prList"><thead><tr>
      <th>PR Date</th><th>PR ID</th><th>Customer ID</th><th>Customer Name</th><th>State</th><th>City</th><th>SI ID</th><th>Invoice Num</th><th>PR Amount</th><th>PR Status</th><th>Actions</th>
    </tr></thead><tbody></tbody></table>
  </div>

  <div id="prProcessingOverlay"><i class="fa fa-spinner fa-pulse"></i>&nbsp; Processing...</div>
  <div id="prModalOverlay" class="modal-overlay"><div class="modal"><div class="modal-header"><h2 id="prModalTitle"></h2></div><div id="prModalBody"></div><div id="prModalFooter" class="modal-footer"></div></div></div>

  <script>
    let prAllData = [];
    let prCustomers = [];
    let prAvailableSIs = [];
    let prCurrent = null;
    let prMode = 'new';

    const esc = value => String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    const num = value => Number(value) || 0;
    const today = () => new Date().toISOString().slice(0, 10);
    const money = value => num(value).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    function showProcessing(show) { document.getElementById('prProcessingOverlay').style.display = show ? 'flex' : 'none'; }
    function openModal() { document.getElementById('prModalOverlay').style.display = 'flex'; }
    function closeModal() { document.getElementById('prModalOverlay').style.display = 'none'; prCurrent = null; prAvailableSIs = []; }
    function alertError(error) { showProcessing(false); alert(error && error.message ? error.message : String(error)); }
    function runServer(method, ...args) { return new Promise((resolve, reject) => google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[method](...args)); }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('prBtnNew').onclick = prNew;
      document.getElementById('prBtnSearch').onclick = prSearch;
      document.getElementById('prBtnClear').onclick = () => { document.getElementById('prSearchInput').value = ''; prRenderList(prAllData); };
      document.getElementById('prSearchInput').addEventListener('keydown', event => { if (event.key === 'Enter') prSearch(); });
      document.getElementById('prModalOverlay').addEventListener('click', event => { if (event.target.id === 'prModalOverlay') closeModal(); });
      prRefresh();
    });

    function prRefresh() {
      showProcessing(true);
      runServer('prGetAllPaymentReceipts').then(data => { prAllData = data || []; prRenderList(prAllData); showProcessing(false); }).catch(alertError);
    }

    function prSearch() {
      const query = document.getElementById('prSearchInput').value.trim().toLowerCase();
      const criterion = document.getElementById('prSearchCriteria').value;
      if (!query) return prRenderList(prAllData);
      prRenderList(prAllData.filter(row => {
        const values = criterion === 'All' ? [row['PR ID'], row['Customer Name'], row['SI ID'], row['Invoice Num'], row['PR Status']] : [row[criterion]];
        return values.some(value => String(value ?? '').toLowerCase().includes(query));
      }));
    }

    function prRenderList(rows) {
      const body = document.querySelector('#prList tbody');
      if (!rows.length) { body.innerHTML = '<tr><td colspan="11" class="empty">No payment receipts found.</td></tr>'; return; }
      body.innerHTML = rows.map(row => `<tr>
        <td>${esc(row['PR Date'])}</td><td>${esc(row['PR ID'])}</td><td>${esc(row['Customer ID'])}</td><td>${esc(row['Customer Name'])}</td><td>${esc(row['State'])}</td><td>${esc(row['City'])}</td><td>${esc(row['SI ID'])}</td><td>${esc(row['Invoice Num'])}</td><td>${money(row['PR Amount'])}</td><td><span class="status-badge">${esc(row['PR Status'] || 'Applied')}</span></td>
        <td><div class="action-cell"><button class="action-btn view-btn" onclick="prView('${esc(row['PR ID'])}')"><i class="fa fa-eye"></i> View</button><button class="action-btn edit-btn" onclick="prEdit('${esc(row['PR ID'])}')"><i class="fa fa-pen"></i> Edit</button><button class="action-btn delete-btn" onclick="prDelete('${esc(row['PR ID'])}')"><i class="fa fa-trash"></i> Delete</button></div></td>
      </tr>`).join('');
    }

    async function prNew() {
      try {
        prMode = 'new'; prCurrent = null; prAvailableSIs = []; showProcessing(true);
        const [customers, prID] = await Promise.all([runServer('prGetCustomers'), runServer('prGeneratePRID')]);
        prCustomers = customers || []; prCurrent = { header: { 'PR ID': prID, 'PR Status': 'Applied' } };
        prRenderModal(); openModal(); showProcessing(false);
      } catch (error) { alertError(error); }
    }

    async function prView(prID) {
      try { showProcessing(true); prMode = 'view'; const [document, customers] = await Promise.all([runServer('prGetPaymentReceipt', prID), runServer('prGetCustomers')]); prCurrent = document; prCustomers = customers || []; prRenderModal(); openModal(); showProcessing(false); } catch (error) { alertError(error); }
    }

    async function prEdit(prID) {
      try {
        showProcessing(true); prMode = 'edit';
        const [document, customers] = await Promise.all([runServer('prGetPaymentReceipt', prID), runServer('prGetCustomers')]);
        prCurrent = document; prCustomers = customers || [];
        prAvailableSIs = await runServer('prGetEligibleSalesInvoices', prCurrent.header['Customer ID'], prID);
        prRenderModal(); openModal(); showProcessing(false);
      } catch (error) { alertError(error); }
    }

    function prRenderModal() {
      const header = prCurrent?.header || {};
      const isView = prMode === 'view';
      const isEdit = prMode === 'edit';
      const customerOptions = prCustomers.map(customer => `<option value="${esc(customer['Customer ID'])}">${esc(customer['Customer ID'])} - ${esc(customer['Customer Name'])}</option>`).join('');
      const currentSIOption = isView && header['SI ID'] ? `<option value="${esc(header['SI ID'])}">${esc(header['SI ID'])} — ${esc(header['Invoice Num'] || '')}</option>` : '';
      const siOptions = currentSIOption + prAvailableSIs.map(si => `<option value="${esc(si['SI ID'])}">${esc(si['SI ID'])} — ${esc(si['Invoice Num'] || '')}</option>`).join('');
      document.getElementById('prModalTitle').textContent = prMode === 'new' ? 'New Payment Receipt' : isEdit ? 'Edit Payment Receipt' : 'View Payment Receipt';
      document.getElementById('prModalBody').innerHTML = `<div class="form-grid">
        <div class="field"><label>PR Date</label><input id="prDate" type="date" value="${esc(header['PR Date'] || today())}" ${isView ? 'disabled' : ''}></div>
        <div class="field"><label>PR ID</label><input id="prID" class="readonly" readonly value="${esc(header['PR ID'] || '')}"></div>
        <div class="field"><label>PR Status</label><input class="readonly" readonly value="${esc(header['PR Status'] || 'Applied')}"></div>
        <div class="field"><label>Customer</label><select id="prCustomer" ${isView || isEdit ? 'disabled' : ''}><option value="">Select customer...</option>${customerOptions}</select></div>
        <div class="field"><label>Sales Invoice</label><select id="prSI" ${isView || isEdit ? 'disabled' : ''}><option value="">Select Sales Invoice...</option>${siOptions}</select></div>
        <div class="field"><label>Invoice Num</label><input id="prInvoiceNum" class="readonly" readonly value="${esc(header['Invoice Num'])}"></div>
        <div class="field"><label>State</label><input id="prState" class="readonly" readonly value="${esc(header['State'])}"></div>
        <div class="field"><label>City</label><input id="prCity" class="readonly" readonly value="${esc(header['City'])}"></div>
        <div class="field"><label>Available SI Balance</label><input id="prSIBalance" class="readonly" readonly value="${num(header['Available SI Balance']).toFixed(2)}"><div class="help-text">Reference only; SI Balance is calculated in the sheet.</div></div>
        <div class="field"><label>PR Amount</label><input id="prAmount" type="number" step="0.01" min="0.01" value="${num(header['PR Amount']).toFixed(2)}" ${isView ? 'disabled' : ''}><div id="prAmountError" class="validation-message"></div></div>
      </div>`;
      document.getElementById('prModalFooter').innerHTML = `<button class="btn-clear" onclick="closeModal()">Close</button>${isView ? '' : '<button id="prSaveBtn"><i class="fa fa-save"></i> Save</button>'}`;
      $('#prCustomer').select2({ dropdownParent: $('#prModalOverlay'), placeholder: 'Select customer...' });
      $('#prSI').select2({ dropdownParent: $('#prModalOverlay'), placeholder: 'Select Sales Invoice...' });
      $('#prCustomer').val(header['Customer ID'] || '').trigger('change.select2');
      $('#prSI').val(header['SI ID'] || '').trigger('change.select2');
      if (prMode === 'new') { $('#prCustomer').on('change', () => prCustomerChanged($('#prCustomer').val())); $('#prSI').on('change', () => prSIChanged($('#prSI').val())); }
      if (!isView) { document.getElementById('prSaveBtn').onclick = prSave; document.getElementById('prAmount').addEventListener('input', prValidateAmount); prValidateAmount(); }
    }

    async function prCustomerChanged(customerID) {
      const customer = prCustomers.find(row => String(row['Customer ID']) === String(customerID));
      document.getElementById('prState').value = customer?.['State'] || ''; document.getElementById('prCity').value = customer?.['City'] || '';
      document.getElementById('prInvoiceNum').value = ''; document.getElementById('prSIBalance').value = '0.00'; document.getElementById('prAmount').value = '0.00'; prValidateAmount();
      try {
        showProcessing(true);
        // A customer may have no eligible invoices. Treat an empty server
        // response as an empty list rather than attempting to iterate null.
        prAvailableSIs = customerID ? (await runServer('prGetEligibleSalesInvoices', customerID, '') || []) : [];
        const select = $('#prSI'); select.empty().append('<option value="">Select Sales Invoice...</option>');
        prAvailableSIs.forEach(si => select.append(new Option(`${si['SI ID']} — ${si['Invoice Num'] || ''}`, si['SI ID']))); select.val('').trigger('change.select2'); showProcessing(false);
      } catch (error) { alertError(error); }
    }

    function prSIChanged(siID) {
      const si = prAvailableSIs.find(row => String(row['SI ID']) === String(siID));
      document.getElementById('prInvoiceNum').value = si?.['Invoice Num'] || '';
      document.getElementById('prSIBalance').value = num(si?.['SI Balance']).toFixed(2);
      document.getElementById('prAmount').value = num(si?.['SI Balance']).toFixed(2);
      prValidateAmount();
    }

    function prValidateAmount() {
      const amount = num(document.getElementById('prAmount').value); const balance = num(document.getElementById('prSIBalance').value); const message = document.getElementById('prAmountError');
      if (amount <= 0) { message.textContent = 'PR Amount must be greater than zero.'; message.classList.add('visible'); return false; }
      if (amount > balance) { message.textContent = `PR Amount cannot exceed the available SI Balance (${money(balance)}).`; message.classList.add('visible'); return false; }
      message.textContent = ''; message.classList.remove('visible'); return true;
    }

    async function prSave() {
      const customerID = $('#prCustomer').val(); const siID = $('#prSI').val();
      if (!customerID || !siID) return alert('Please select a customer and Sales Invoice.');
      if (!prValidateAmount()) return;
      const payload = { master: { 'PR Date': document.getElementById('prDate').value, 'PR ID': document.getElementById('prID').value, 'Customer ID': customerID, 'SI ID': siID, 'PR Amount': num(document.getElementById('prAmount').value) } };
      try { showProcessing(true); const result = await runServer('prSavePaymentReceipt', payload); closeModal(); prRefresh(); alert(`Payment Receipt ${result.prID} saved successfully.`); } catch (error) { alertError(error); }
    }

    async function prDelete(prID) {
      if (!confirm(`Delete Payment Receipt ${prID}? This will reverse its payment effects and recalculate the Sales Invoice status.`)) return;
      try { showProcessing(true); await runServer('prDeletePaymentReceipt', prID); prRefresh(); alert(`Payment Receipt ${prID} deleted successfully.`); } catch (error) { alertError(error); }
    }
  </script>
</body>
</html>
