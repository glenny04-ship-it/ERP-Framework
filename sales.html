<html>
<head>

    src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js">

  <style>
  :root {
    /* Sonsi Brand Palette */
    --brand-burgundy: #78141D;
    --brand-burgundy-dark: #4A080E;
    --brand-burgundy-light: #941B26;
    --brand-gold: #E5C058;
    --brand-gold-bright: #FBE6A3;
    --brand-gold-dark: #B58A2B;
    --brand-cream: #FAF6EE;
    --text-dark: #2C1810;
    --text-muted: #6B5B52;
    --border-color: #E8DCCB;
  }

  /* === Base Styles === */

  body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: var(--brand-cream);
    color: var(--text-dark);
  }
  
  h1, h2 { 
    margin: 0; 
  }

  .container { 
    padding: 24px; 
  }

  .flex { 
    display: flex; 
    align-items: center; 
  }

  .flex-space { 
    justify-content: space-between; 
  }

  /* === Header === */
  #soHeader { 
    margin-bottom: 20px; 
  }

  #soHeader h1 { 
    font-family: 'Montserrat', sans-serif;
    font-size: 1.8rem; 
    font-weight: 700; 
    color: var(--brand-burgundy-dark);
  }

  #soHeader h2 { 
    font-size: 0.95rem; 
    font-weight: 400; 
    color: var(--text-muted); 
    margin-top: 4px;
  }

  /* === Action Bar & Search Group (Matching Customer Page) === */
  .action-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 15px;
  }

  .btn-group {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .search-group {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-left: auto; /* Aligns filter and search controls to the right side */
  }

  .search-select {
    padding: 9px 12px;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    background-color: #FFFFFF;
    color: var(--text-dark);
    font-family: 'Poppins', sans-serif;
    font-size: 0.9rem;
  }

  .search-input {
    padding: 9px 14px;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    width: 250px;
    font-family: 'Poppins', sans-serif;
    font-size: 0.9rem;
    color: var(--text-dark);
    background-color: #FFFFFF;
  }

  .search-input:focus,
  .search-select:focus {
    border-color: var(--brand-burgundy);
    outline: none;
    box-shadow: 0 0 0 2px rgba(120, 20, 29, 0.15);
  }

  /* === Buttons & Inputs === */
  button, .btn {
    background: linear-gradient(180deg, var(--brand-burgundy-light) 0%, var(--brand-burgundy) 100%);
    color: var(--brand-gold-bright);
    border: 1px solid var(--brand-gold-dark);
    padding: 9px 16px;
    margin: 0 2px;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'Poppins', sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    transition: all 0.25s ease;
    box-shadow: 0 2px 5px rgba(120, 20, 29, 0.15);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  button:hover, .btn:hover { 
    background: var(--brand-burgundy-dark); 
    color: #FFFFFF;
    border-color: var(--brand-gold);
    transform: translateY(-1px);
  }

  .btn-clear { 
    background: #FFFFFF; 
    color: var(--brand-burgundy); 
    border: 1px solid var(--border-color);
    box-shadow: none;
  }

  .btn-clear:hover {
    background: var(--brand-cream);
    color: var(--brand-burgundy-dark);
    border-color: var(--brand-burgundy-light);
  }

  input, select {
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid var(--border-color);
    font-size: 0.9rem;
    font-family: 'Poppins', sans-serif;
    color: var(--text-dark);
    background-color: #FFFFFF;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  input:focus, select:focus {
    border-color: var(--brand-burgundy);
    outline: none;
    box-shadow: 0 0 0 2px rgba(120, 20, 29, 0.15);
  }

  /* === Table Action Cells & Buttons (Matching Customer Page) === */
  .action-cell {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .action-btn {
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 500;
    transition: all 0.2s ease;
    border: none;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .view-btn {
    background-color: var(--brand-burgundy-dark);
    color: var(--brand-gold-bright);
    border: 1px solid var(--brand-gold-dark);
  }

  .view-btn:hover {
    background-color: var(--brand-burgundy);
    color: #FFFFFF;
  }

  .edit-btn {
    background-color: var(--brand-gold);
    color: var(--brand-burgundy-dark);
    border: 1px solid var(--brand-gold-dark);
  }

  .edit-btn:hover {
    background-color: var(--brand-gold-dark);
    color: #FFFFFF;
  }

  .update-btn {
    background-color: #2D6A4F;
    color: white;
    border: none;
  }

  .update-btn:hover {
    background-color: #1B4332;
  }

  .cancel-btn {
    background-color: #8C7A6B;
    color: white;
    border: none;
  }

  .cancel-btn:hover {
    background-color: #6B5B52;
  }

  .delete-btn {
    background-color: var(--brand-burgundy-light);
    color: white;
    border: none;
  }

  .delete-btn:hover {
    background-color: var(--brand-burgundy-dark);
  }

  /* === Tables === */
  table { 
    width: 100%; 
    border-collapse: collapse; 
    margin-top: 15px; 
    background-color: #FFFFFF;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(74, 8, 14, 0.04);
  }

  th, td {
    padding: 12px;
    border: 1px solid var(--border-color);
    font-size: 0.9rem;
    color: var(--text-dark);
  }

  th { 
    background: var(--brand-burgundy-dark); 
    color: var(--brand-gold-bright);
    font-family: 'Montserrat', sans-serif;
    font-weight: 600;
    letter-spacing: 0.5px;
    border-bottom: 2px solid var(--brand-gold);
    position: sticky; 
    top: 0; 
    z-index: 2; 
  }

  tbody tr:nth-child(even) { 
    background: #FDF9F3; 
  }

  tbody tr:hover {
    background: #FAF2E6;
  }

  /* === Modal Overlay === */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(44, 24, 16, 0.5);
    backdrop-filter: blur(2px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
  }

  .modal {
    background: #FFFFFF;
    border-radius: 10px;
    border-top: 5px solid var(--brand-burgundy);
    width: 90vw;        /* take 90% of viewport width */
    max-width: none;    /* remove any smaller cap */
    max-height: 90vh;
    overflow: auto;
    padding: 24px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.25);
  }

  .modal-header { 
    margin-bottom: 18px; 
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border-color);
  }

  .modal-header h2 {
    font-family: 'Montserrat', sans-serif;
    color: var(--brand-burgundy-dark);
    font-size: 1.4rem;
    font-weight: 700;
  }

  .modal-footer { 
    text-align: right; 
    margin-top: 20px; 
    padding-top: 15px;
    border-top: 1px solid var(--border-color);
  }

  /* === Inline Row Controls === */
  .add-row { 
    color: var(--brand-burgundy); 
    cursor: pointer; 
    font-weight: 600; 
    transition: color 0.2s ease;
  }

  .add-row:hover {
    color: var(--brand-burgundy-light);
  }

  .remove-row { 
    color: var(--brand-burgundy-light); 
    cursor: pointer; 
    font-weight: 700; 
    font-size: 1.1rem;
    transition: color 0.2s ease;
  }

  .remove-row:hover {
    color: var(--brand-burgundy-dark);
  }
  
  /* === Processing Overlay === */
  #soProcessingOverlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(250, 246, 238, 0.85);
    display: none; align-items: center; justify-content: center;
    z-index: 10000;
    font-size: 1.2rem; 
    font-weight: 600;
    font-family: 'Montserrat', sans-serif;
    color: var(--brand-burgundy);
  }

  /* Ensure select2 menus float above modal-overlay (z-index:9999) */
  .select2-container--open .select2-dropdown {
    z-index: 10000 !important;
  }

  /* Auto-fit columns and prevent wrapping in both tables */
  #soNewLines,
  #soDetailsTable {
    table-layout: auto;    /* content defines width */
    white-space: nowrap;    /* keep each cell on one line */
  }
</style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div id="soHeader" class="flex-space">
      <div>
        <h1>Sales Orders</h1>
        <h2>Add and manage your SOs</h2>
      </div>
      <button id="soBtnNewSO"><i class="fa fa-plus"></i> New SO</button>
    </div>

    <!-- Navigation & Search -->
    <div class="flex-space">
      <div></div>
      <div class="flex">
        <select id="soSearchCriteria">
          <option>All</option>
          <option>SO ID</option>
          <option>Customer Name</option>
          <option>Invoice Num</option>
          <option>SO Status</option>
        </select>
        <input type="text" id="soSearchInput" placeholder="Search...">
        <button id="soBtnSearch">Search</button>

    </div>

    <!-- SO List Table -->
    <table id="solist">
      <thead>
        <tr>
          <th>SO Date</th><th>SO ID</th><th>Customer ID</th><th>Customer Name</th>

    <div class="modal" id="soModal">
      <div class="modal-header">
        <h2 id="soModalTitle">Modal Title</h2>
      </div>
      <div class="modal-body" id="soModalBody">
        <!-- Content injected by JS -->
      </div>
      <div class="modal-footer" id="soModalFooter">
        <!-- Buttons injected by JS -->
      </div>
    </div>
  </div>


<script>
    /* === Utility & State === */
    let soAllData = [];      
    let soSearchData = [];   
    let soCustomers = [];
    let soInventory = [];
    let deletedDetailIDs = [];

    let currentDocument = null;
    let currentMode = "new";   // "new" | "edit"

        /* === Security Escape Utility === */
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    

    /* === Initialization === */
document.addEventListener('DOMContentLoaded', () => {

  console.log("Sales page initialized");

  soRefreshSOList();

  google.script.run
    .withSuccessHandler(data => { 
      console.log("Inventory loaded:", data.length);
      console.log(data);
      soInventory = data; 
    })
    .withFailureHandler(err => {
      console.error('soGetInventoryItems failed:', err);
    })
    .soGetInventoryItems();


  const btnNew = document.getElementById('soBtnNewSO');

  if (btnNew) {
    if (typeof openSalesOrderEditor === "function") {
      btnNew.onclick = () => openSalesOrderEditor(null);
    } else {
      console.error("openSalesOrderEditor is missing");
    }
  }

  const btnSearch = document.getElementById('soBtnSearch');

  if (btnSearch) {
    if (typeof applySearch === "function") {
      btnSearch.onclick = applySearch;
    } else {
      console.error("applySearch is missing");
    }
  }

  const btnClear = document.getElementById('soBtnClear');

if (btnClear) {
  btnClear.onclick = function() {
    if (typeof clearSearch === "function") {
      clearSearch();
    } else {
      console.error("clearSearch is missing");
    }
    soRefreshSOList();
  };
}

});
    /* === Rendering SO List === */
function soRefreshSOList() {

    const overlay = document.getElementById('soProcessingOverlay');

    if (overlay) {
        overlay.style.display = 'flex';
    }

    google.script.run

        .withSuccessHandler(rows => {

            try {

                renderSOList(rows);

            } catch (err) {

                console.error("renderSOList failed:", err);

                alert(
                    "Failed to render Sales Orders:\n\n" +
                    (err.message || err)
                );

            } finally {

                if (overlay) {
                    overlay.style.display = 'none';
                }

            }

        })

        .withFailureHandler(err => {

            console.error("Full error:", err);
            console.error("Message:", err.message);
            console.error("Stack:", err.stack);

            if (overlay) {
                overlay.style.display = 'none';
            }

            alert(
                "Failed to load Sales Orders:\n\n" +
                (err.message || JSON.stringify(err))
            );

        })

        .soGetAllSO();
}

function renderSOList(rows) {

  soAllData = rows || [];

  const tbody = document.querySelector('#solist tbody');

  if (!tbody) {
    console.error("SO list table body not found.");
    return;
  }

  tbody.innerHTML = '';

  soAllData.forEach(r => {

    const totalAmt = parseFloat(r['Total SO Amount']) || 0;

    const tr = document.createElement('tr');

    tr.innerHTML = `
      <td>${escapeHtml(new Date(r['SO Date']).toLocaleDateString())}</td>
      <td>${escapeHtml(r['SO ID'])}</td>
      <td>${escapeHtml(r['Customer ID'])}</td>
      <td>${escapeHtml(r['Customer Name'])}</td>
      <td>${escapeHtml(r['Invoice Num'])}</td>
      <td>${escapeHtml(r['State'])}</td>
      <td>${escapeHtml(r['City'])}</td>
      <td>${totalAmt.toFixed(2)}</td>
  <button class="btn"
      onclick= "soEditSalesOrder('${escapeHtml(r['SO ID'])}')">
      Edit
  </button> <button class="btn"
      onclick="soDeleteSalesOrder('${escapeHtml(r['SO ID'])}')">
      Delete
  </button>
</td>
    `;

    tbody.appendChild(tr);

  });


  const overlay = document.getElementById('soProcessingOverlay');

  if (overlay) {
    overlay.style.display = 'none';
  }

}

function applySearch() {
  const crit = document.getElementById('soSearchCriteria').value;
  const val  = document.getElementById('soSearchInput').value.toLowerCase();

  if (!val) {
    renderSOList(soAllData);
    return;
  }

  const filtered = soAllData.filter(r => {
    if (crit === 'All') {
      return Object.values(r).some(v => (''+v).toLowerCase().includes(val));
    }
    return (''+r[crit]).toLowerCase().includes(val);
  });

  if (!filtered.length) {
    alert('No matching data found');
  }
  renderSOList(filtered);
}
    
    function clearSearch() {
      document.getElementById('soSearchInput').value = '';
      document.getElementById('soSearchCriteria').value = 'All';
      renderSOList(soAllData);
    }


    /* === Modal Framework === */

function showModal(title, body, footer) {
  const overlay = document.getElementById("soModalOverlay");
  const modal = document.getElementById("soModal");
  document.getElementById("soModalTitle").innerHTML = title;
  document.getElementById("soModalBody").innerHTML = body;
  document.getElementById("soModalFooter").innerHTML = footer;
  overlay.style.display = "flex";
}

function closeModal() {
  const overlay = document.getElementById("soModalOverlay");
  if (overlay) {
      overlay.style.display = "none";
  }
}

function populateCustomerDropdown(customers) {

  console.log('populateCustomerDropdown got:',customers);

  const sel =
    document.getElementById('soNewCustomer');

  if (!sel) {
    console.error(
      '#soNewCustomer not found'
    );
    return;
  }

  sel.innerHTML = '<option></option>';

  (customers || [])
    .filter(c => c['Customer Name'])
    .forEach(cust => {

      const opt = document.createElement('option');
      opt.value = cust['Customer Name'];
      opt.textContent = cust['Customer Name'];
      sel.appendChild(opt);
    });

  if (
    $('#soNewCustomer').hasClass('select2-hidden-accessible')
  ) {
    $('#soNewCustomer').select2('destroy');

  }

  $('#soNewCustomer').select2({
      placeholder:
        'Select Customer',
      width:
        '100%'
    })
    .on(
      'change',
      function() {

        const name = this.value;
        const cust = (customers || []).find(x => x['Customer Name'] === name);

        if (cust) {
          document.getElementById('soNewCustID').value = cust['Customer ID'] || "";
          document.getElementById('soNewState').value = cust['State'] || "";
          document.getElementById('soNewCity').value = cust['City'] || "";
        }

      }
    );

}


function openSalesOrderEditor(soDocument = null) {

    currentDocument = soDocument;
    currentMode = soDocument ? "edit" : "new";

    const body = newSOFormBody();
    const footer = newSOFormFooter();

    showModal(
        currentMode === "edit"
            ? "Edit Sales Order"
            : "New Sales Order",
        body,
        footer
    );

    google.script.run
        .withSuccessHandler(customers => {

            populateCustomerDropdown(customers);

            if (currentMode === "new") {

                document.getElementById("soNewDate").value = new Date().toISOString().split("T")[0];
                document.getElementById("soNewSOStatus").value = "Open";

                // Generate Sales Order ID
                google.script.run
                    .withSuccessHandler(soID => {

                        document.getElementById("soNewSOID").value =
                            soID;

                    })
                    .withFailureHandler(err => {

                        console.error(
                            "Failed to generate Sales Order ID:",
                            err
                        );

                        alert(
                            "Unable to generate Sales Order ID.\n\n" +
                            (err.message || err)
                        );

                    })
                    .Document_generateID("SalesOrder");

            } else {

                loadSalesOrder(soDocument);
            }
        })
        .withFailureHandler(err => {

            console.error(
                "Failed to load customers:",
                err
            );

        })
        .soGetCustomers();
}

    // Claude 
  async function addSOLine(existingRow = null) {
  const validation = validateSOHeader();
  if (!validation.valid) {
    alert(validation.message);
    return;
  }

  try {
    const tbody = document.querySelector('#soNewLines tbody');
    const rowIdx = tbody.children.length;

    const soDate = document.getElementById('soNewDate').value;
    const soID   = document.getElementById('soNewSOID').value;
    const custID = document.getElementById('soNewCustID').value;
    const custNm = $('#soNewCustomer').val();
    const state  = document.getElementById('soNewState').value;
    const city   = document.getElementById('soNewCity').value;
    const inv    = document.getElementById('soNewInvoice').value;

let detailID;

if (existingRow) {

    // Existing saved detail — preserve its ID.
    detailID = existingRow["Detail ID"];

} else {

    // New detail — determine the next sequence
    // from the rows currently displayed on the form.

    const detailIDs = Array.from(
        tbody.querySelectorAll(".soDetailID")
    )
    .map(el => el.textContent.trim())
    .filter(id => id);

    let maxSequence = 0;

    const prefix = `${soID}-`;

    detailIDs.forEach(id => {

        if (!id.startsWith(prefix)) {
            return;
        }

        const sequence = parseInt(
            id.substring(prefix.length),
            10
        );

        if (!isNaN(sequence)) {
            maxSequence = Math.max(
                maxSequence,
                sequence
            );
        }
    });

    // Generate the next Detail ID locally.
    detailID =
        `${soID}-${String(maxSequence + 1).padStart(2, "0")}`;
}


    const tr = document.createElement('tr');
    tr.setAttribute('data-idx', rowIdx);
    tr.innerHTML = `
     <td style="display:none">${escapeHtml(soDate)}</td>
     <td style="display:none">${escapeHtml(soID)}</td>
      <td class="soDetailID">${escapeHtml(detailID)}</td>
      <td style="display:none">${escapeHtml(custID)}</td>
      <td style="display:none">${escapeHtml(custNm)}</td>
      <td style="display:none">${escapeHtml(state)}</td>
      <td style="display:none">${escapeHtml(city)}</td>
      <td style="display:none">${escapeHtml(inv)}</td>
      <td><select class="soItemName" style="width:150px"></select></td>
      <td class="soItemID"></td>
      <td class="soItemType" style="display:none"></td>
      <td class="soItemCat" style="display:none"></td>
      <td class="soItemSubcat style="display:none""></td>
      <td><input type="number" class="soQty" min="1" value="1" style="width: 80px;"></td>
      <td><input type="number" class="soDelQty" value="0" readonly style="width: 80px;"></td>
      <td><input type="number" class="soBalQty" value="0" readonly style="width: 80px;"></td>
      <td><input type="number" class="soUnitPrice" step="0.5" value="0.00" style="width: 100px;"></td>
      <td class="soAmountExcl" style="width: 60px;">0.00</td>
      <td><input type="number" class="soTaxRate" step="0.5" value="0.00" style="width: 80px;"></td>
      <td class="soTotalTax" style="width: 60px;">0.00</td>
      <td class="soAmountIncl" style="width: 60px;">0.00</td>
      <td><input type="number" class="soShipFees" step="0.5" value="0.00" style="width: 80px;"></td>
      <td class="soTotalSales" style="width: 90px;">0.00</td>
      <td><span class="remove-row" onclick="removeSOLine(this)">×</span></td>

    `;
    tbody.appendChild(tr);

    // sel must exist, be populated, and have select2 bound BEFORE we set its value
    const sel = tr.querySelector('.soItemName');
    soInventory.forEach(item => {
      const opt = new Option(item['Item Name'], item['Item Name'], false, false);
      sel.add(opt);
    });

    $(sel).select2({ placeholder: 'Item Name' })
      .on('change', function() {
        const itemName = this.value;
        const item = soInventory.find(i => i['Item Name'] === itemName);
        if (item) {
          tr.querySelector('.soItemID').innerText   = item['Item ID'] || '';
          tr.querySelector('.soItemType').innerText = item['Item Type'] || '';
          tr.querySelector('.soItemCat').innerText  = item['Item Category'] || '';
          tr.querySelector('.soItemSubcat').innerText = item['Item Subcategory'] || '';
          recalcLine(tr);
        }
      });

    ['.soQty', '.soUnitPrice', '.soTaxRate', '.soShipFees'].forEach(cls => {
      tr.querySelector(cls).addEventListener('input', () => recalcLine(tr));
    });

    if (existingRow) {
      $(sel).val(existingRow["Item Name"]).trigger("change"); // now safe, and fires the change handler above
      tr.querySelector(".soQty").value       = existingRow["QTY Ordered"];
      tr.querySelector(".soDelQty").value    = existingRow["QTY Delivered"];
      tr.querySelector(".soBalQty").value    = existingRow["QTY Balance"];
      tr.querySelector(".soUnitPrice").value = existingRow["Unit Price"];
      tr.querySelector(".soTaxRate").value   = existingRow["Tax Rate"];
      tr.querySelector(".soShipFees").value  = existingRow["Shipping Fees"];
      recalcLine(tr);
    }

  } catch (err) {
    console.error('Error adding line item:', err);
    alert("Error: " + (err.message || err));
  }
}

function removeSOLine(button) {

    const row = button.closest("tr");

    if (!row) {
        return;
    }

    row.remove();

    soCalculateFormTotal();
}

function recalcLine(tr) {

  const qty =
    Number(tr.querySelector('.soQty').value) || 0;

  const unitPrice =
    Number(tr.querySelector('.soUnitPrice').value) || 0;

  const taxRate =
    Number(tr.querySelector('.soTaxRate').value) || 0;

  const shipping =
    Number(tr.querySelector('.soShipFees').value) || 0;

  const amountExcl = qty * unitPrice;
  const totalTax = amountExcl * taxRate / 100;
  const amountIncl = amountExcl + totalTax;
  const totalSales = amountIncl + shipping;

  tr.querySelector('.soAmountExcl').innerText =
    amountExcl.toFixed(2);

  tr.querySelector('.soTotalTax').innerText =
    totalTax.toFixed(2);

  tr.querySelector('.soAmountIncl').innerText =
    amountIncl.toFixed(2);

  tr.querySelector('.soTotalSales').innerText =
    totalSales.toFixed(2);

  // Recalculate Sales Order total
  soCalculateFormTotal();
}


function soCalculateFormTotal() {

  let total = 0;

  document
    .querySelectorAll("#soNewLines tbody tr")
    .forEach(tr => {

      const lineTotal =
        Number(
          tr.querySelector(".soTotalSales")?.innerText
        ) || 0;

      total += lineTotal;
    });

  // Update SO Total Amount
  const totalField =
    document.getElementById("soNewTotalAmount");

  if (totalField) {
    totalField.value = total;
  }

  return total;
}

function validateSOHeader() {

  if (!document.getElementById('soNewSOID').value) {
    return {
      valid: false,
      message: 'Please generate a Sales Order ID.'
    };
  }

  if (!$('#soNewCustomer').val()) {
    return {
      valid: false,
      message: 'Please select a Customer.'
    };
  }

  if (!document.getElementById('soNewDate').value) {
    return {
      valid: false,
      message: 'Please select the Sales Order Date.'
    };
  }

  return { valid: true };
}

function buildSODTO() {

  // Check if we are editing an existing document
  const isEdit = typeof currentMode !== 'undefined' && currentMode === "edit" && currentDocument;

  const master = {
    "SO Date": document.getElementById("soNewDate").value,
    "SO ID": document.getElementById("soNewSOID").value,
    "Customer ID": document.getElementById("soNewCustID").value,
    "Customer Name": $("#soNewCustomer").val(),
    "Invoice Num": document.getElementById("soNewInvoice").value,
    "State": document.getElementById("soNewState").value,
    "City": document.getElementById("soNewCity").value,
    "Total SO Amount": soCalculateFormTotal(),
    "SO Status": document.getElementById("soNewSOStatus").value,
};

  const details = [];

  document
    .querySelectorAll("#soNewLines tbody tr")
    .forEach(tr => {

      details.push({

        "SO Date": tr.cells[0].innerText,
        "SO ID": tr.cells[1].innerText,
        "Detail ID": tr.querySelector(".soDetailID").innerText,
        "Customer ID": tr.cells[3].innerText,
        "Customer Name": tr.cells[4].innerText,
        "State": tr.cells[5].innerText,
        "City": tr.cells[6].innerText,
        "Invoice Num": tr.cells[7].innerText,
        "Item Name": tr.querySelector(".soItemName").value,
        "Item ID": tr.querySelector(".soItemID").innerText,
        "Item Type": tr.querySelector(".soItemType").innerText,
        "Item Category": tr.querySelector(".soItemCat").innerText,
        "Item Subcategory": tr.querySelector(".soItemSubcat").innerText,
        "QTY Ordered": Number(tr.querySelector(".soQty").value),
        "QTY Delivered": Number(tr.querySelector(".soDelQty").value),
        "QTY Balance": Number(tr.querySelector(".soBalQty").value),
        "Unit Price": Number(tr.querySelector(".soUnitPrice").value),
        "Amount Excl Tax": Number(tr.querySelector(".soAmountExcl").innerText),
        "Tax Rate": Number(tr.querySelector(".soTaxRate").value),
        "Total Tax": Number(tr.querySelector(".soTotalTax").innerText),
        "Amount Incl Tax": Number(tr.querySelector(".soAmountIncl").innerText),
        "Shipping Fees": Number(tr.querySelector(".soShipFees").value),
        "Total Sales Amount": Number(tr.querySelector(".soTotalSales").innerText)
      });

    });

  return {
  type: "SalesOrder",
  master,
  details: {
    SalesDetails: details
  }
};

}

function saveNewSO() {

  // Build the complete Sales Order DTO
  const payload = buildSODTO();

  // Basic client-side validation
  if (!payload || typeof payload !== "object") {
    alert("Unable to build Sales Order payload.");
    return;
  }

  if (!payload.master || !payload.master["SO ID"]) {
    alert("Sales Order ID is required.");
    return;
  }

  if (!payload.master["Customer ID"]) {
    alert("Customer is required.");
    return;
  }

  if (
    !payload.details ||
    !Array.isArray(payload.details["SalesDetails"]) ||
    payload.details["SalesDetails"].length === 0
  ) {
    alert("Sales Order must contain at least one detail line.");
    return;
  }

  const successMessage =
    currentMode === "edit"
      ? "Sales Order updated successfully."
      : "Sales Order saved successfully.";

  // Prevent duplicate submissions while save is in progress
  const saveButton =
    document.getElementById("soBtnSave");

  if (saveButton) {
    saveButton.disabled = true;
  }

  google.script.run

    .withSuccessHandler(result => {

      if (saveButton) {
        saveButton.disabled = false;
      }

      console.log(
        "Sales Order save result:",
        result
      );

      closeModal();
      soRefreshSOList();

      alert(successMessage);
    })

    .withFailureHandler(err => {

      if (saveButton) {
        saveButton.disabled = false;
      }

      console.error(
        "Sales Order save failed:",
        err
      );

      alert(
        err && err.message
          ? err.message
          : String(err)
      );
    })

    .soSaveSalesOrder(payload);
}

// Chat GPT function
async function loadSalesOrder(doc) {

    console.log("loadSalesOrder received:", doc);

    if (!doc) {
        throw new Error("No document returned");
    }

    if (!doc.header) {
        console.error("Missing header. Received:", doc);
        throw new Error("Document header missing");
    }

    const header = doc.header;

    // =========================
    // Header
    // =========================

    document.getElementById("soNewSOID").value = header["SO ID"] || "";
    document.getElementById("soNewCustID").value = header["Customer ID"] || "";
    document.getElementById("soNewInvoice").value = header["Invoice Num"] || "";
    const soDate = header["SO Date"];
    document.getElementById("soNewDate").value = soDate ? String(soDate).substring(0, 10) : "";
    document.getElementById("soNewState").value = header["State"] || "";
    document.getElementById("soNewCity").value = header["City"] || "";
    document.getElementById("soNewSOStatus").value = header["SO Status"] || "";


    // =========================
    // Customer
    // =========================

    $("#soNewCustomer")
        .val(header["Customer Name"] || "")
        .trigger("change");


    // =========================
    // Details
    // =========================

    const detailRows = doc.details?.SalesDetails || [];

    console.log("SalesDetails received:", detailRows);

    for (const row of detailRows) {
        await addSOLine(row);
    }
}


function soEditSalesOrder(soID) {

    console.log("soEditSalesOrder received:", soID);

    if (!soID) {
        alert("No Sales Order ID was provided.");
        return;
    }

    google.script.run
        .withSuccessHandler(doc => {

            console.log("Document_get result:", doc);

            if (!doc) {
                alert(
                    "Sales Order could not be loaded.\n\n" +
                    "No document was returned for: " + soID
                );
                return;
            }

            if (!doc.header) {
                console.error("Invalid document returned:", doc);

                alert(
                    "Sales Order could not be loaded.\n\n" +
                    "Document header is missing."
                );
                return;
            }

            // Store the document being edited.
            currentDocument = doc;

            // Open the editor with the retrieved document.
            openSalesOrderEditor(doc);
        })
        .withFailureHandler(err => {

            console.error(
                "Document_get failed for Sales Order:",
                soID,
                err
            );

            alert(
                "Failed to load Sales Order.\n\n" +
                (err && err.message
                    ? err.message
                    : String(err))
            );
        })
        .Document_get("SalesOrder", soID);
}
