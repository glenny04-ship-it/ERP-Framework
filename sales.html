<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <title>Sales Orders</title>
  <link href="https://fonts.googleapis.com/css?family=Poppins:400,600|Roboto:400,500|Montserrat:400,500" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <style>
    body{margin:0;font-family:Poppins,sans-serif;background:#f4f6f8;color:#333}.container{padding:20px}.flex{display:flex;align-items:center}.flex-space{display:flex;justify-content:space-between;align-items:center}h1,h2,h3{margin:0}.btn,button{background:#008b8b;color:#fff;border:0;padding:8px 14px;margin:0 5px;border-radius:4px;cursor:pointer;font-family:Roboto,sans-serif}.btn:hover,button:hover{background:#006f6f}.btn-clear{background:#ccc;color:#333}input,select{padding:6px 10px;border:1px solid #ccc;border-radius:4px;font-size:.9rem}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{padding:8px;border:1px solid #e2e2e2;font-size:.88rem;white-space:nowrap}th{background:#e8f7f7;position:sticky;top:0;z-index:2}tbody tr:nth-child(even){background:#fafafa}.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:9999}.modal{background:#fff;border-radius:6px;width:90vw;max-height:90vh;overflow:auto;padding:20px;box-shadow:0 4px 12px rgba(0,0,0,.2)}.modal-footer{text-align:right;margin-top:15px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.field label{display:block;font-size:.8rem;margin-bottom:3px}.readonly{background:#f3f3f3}.danger{color:#d9534f;cursor:pointer;font-weight:600}.status{font-weight:600}.processing{position:fixed;inset:0;background:rgba(255,255,255,.7);display:none;align-items:center;justify-content:center;z-index:10000;font-size:1.2rem;color:#008b8b}.select2-container--open .select2-dropdown{z-index:10000!important}
  </style>
</head>
<body>
<div class="container">
  <div class="flex-space" style="margin-bottom:20px">
    <div><h1>Sales Orders</h1><div style="color:#555">Customer commitments and inventory allocation</div></div>
    <button id="soBtnNewSO"><i class="fa fa-plus"></i> New SO</button>
  </div>
  <div class="flex-space"><div></div><div class="flex">
    <select id="soSearchCriteria"><option>All</option><option>SO ID</option><option>Customer Name</option><option>Invoice Num</option><option>SO Status</option></select>
    <input id="soSearchInput" placeholder="Search..."><button id="soBtnSearch">Search</button><button class="btn-clear" id="soBtnClear">Clear</button>
  </div></div>
  <table id="solist"><thead><tr><th>SO Date</th><th>SO ID</th><th>Customer ID</th><th>Customer Name</th><th>Invoice Num</th><th>State</th><th>City</th><th>Total SO Amount</th><th>SO Status</th><th>Actions</th></tr></thead><tbody></tbody></table>
</div>
<div id="processing" class="processing"><i class="fa fa-spinner fa-pulse"></i>&nbsp; Processing...</div>
<div id="soModalOverlay" class="modal-overlay"><div class="modal"><div><h2 id="soModalTitle"></h2></div><div id="soModalBody"></div><div id="soModalFooter" class="modal-footer"></div></div></div>
<script>
let soAllData=[],soCustomers=[],soInventory=[],currentDocument=null,currentMode='new';
function esc(v){if(v===null||v===undefined)return '';return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function showProcessing(v){document.getElementById('processing').style.display=v?'flex':'none'}
function showModal(title,body,footer){document.getElementById('soModalTitle').textContent=title;document.getElementById('soModalBody').innerHTML=body;document.getElementById('soModalFooter').innerHTML=footer;document.getElementById('soModalOverlay').style.display='flex'}
function closeModal(){document.getElementById('soModalOverlay').style.display='none'}
function formatDate(v){if(!v)return '';const d=new Date(v);return isNaN(d)?String(v):d.toLocaleDateString()}
function loadSOList(){showProcessing(true);google.script.run.withSuccessHandler(rows=>{showProcessing(false);renderSOList(rows||[])}).withFailureHandler(e=>{showProcessing(false);alert('Failed to load Sales Orders:\n\n'+(e.message||e))}).soGetAllSO()}
function renderSOList(rows){soAllData=rows||[];const tb=document.querySelector('#solist tbody');tb.innerHTML='';soAllData.forEach(r=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${esc(formatDate(r['SO Date']))}</td><td>${esc(r['SO ID'])}</td><td>${esc(r['Customer ID'])}</td><td>${esc(r['Customer Name'])}</td><td>${esc(r['Invoice Num'])}</td><td>${esc(r['State'])}</td><td>${esc(r['City'])}</td><td>${(Number(r['Total SO Amount'])||0).toFixed(2)}</td><td class="status">${esc(r['SO Status']||'Open')}</td><td><button onclick="editSO('${esc(r['SO ID'])}')">Edit</button><button onclick="deleteSO('${esc(r['SO ID'])}')">Delete</button></td>`;tb.appendChild(tr)})}
function applySearch(){const crit=document.getElementById('soSearchCriteria').value,val=document.getElementById('soSearchInput').value.toLowerCase().trim();if(!val){renderSOList(soAllData);return}renderSOList(soAllData.filter(r=>crit==='All'?Object.values(r).some(x=>String(x??'').toLowerCase().includes(val)):String(r[crit]??'').toLowerCase().includes(val)))}
function newForm(){return `<div class="grid"><div class="field"><label>SO ID</label><input id="soID" class="readonly" readonly></div><div class="field"><label>SO Date</label><input id="soDate" type="date"></div><div class="field"><label>Customer</label><select id="soCustomer" style="width:100%"></select></div><div class="field"><label>Customer ID</label><input id="soCustomerID" class="readonly" readonly></div><div class="field"><label>State</label><input id="soState" class="readonly" readonly></div><div class="field"><label>City</label><input id="soCity" class="readonly" readonly></div><div class="field"><label>Invoice Num</label><input id="soInvoice"></div><div class="field"><label>SO Status</label><input id="soStatus" class="readonly" readonly></div><div class="field"><label>Total SO Amount</label><input id="soTotal" class="readonly" readonly></div></div><hr><div class="flex-space"><h3>Line Items</h3><button onclick="addLine()">+ Add Row</button></div><table id="soLines"><thead><tr><th>Detail ID</th><th>Item</th><th>Item ID</th><th>QTY Ordered</th><th>QTY Delivered</th><th>QTY Balance</th><th>Unit Price</th><th>Price Excl Tax</th><th>Tax Rate</th><th>Total Tax</th><th>Price Incl Tax</th><th>Shipping Fees</th><th>Total Sales Price</th><th></th></tr></thead><tbody></tbody></table>`}
function initCustomerSelect(selected){const s=$('#soCustomer');s.empty().append(new Option('', '', false, false));soCustomers.filter(c=>c['Customer Name']).forEach(c=>s.append(new Option(c['Customer Name'],c['Customer ID'],false,false)));if(s.hasClass('select2-hidden-accessible'))s.select2('destroy');s.select2({placeholder:'Select Customer',width:'100%'}).off('change').on('change',function(){const c=soCustomers.find(x=>String(x['Customer ID'])===String(this.value));if(c){$('#soCustomerID').val(c['Customer ID']||'');$('#soState').val(c['State']||'');$('#soCity').val(c['City']||'')}});if(selected)s.val(selected['Customer ID']).trigger('change')}
function openEditor(doc){currentDocument=doc||null;currentMode=doc?'edit':'new';showModal(doc?'Edit Sales Order':'New Sales Order',newForm(),'<button onclick="saveSO()">Save</button><button class="btn-clear" onclick="closeModal()">Close</button>');google.script.run.withSuccessHandler(c=>{soCustomers=c||[];initCustomerSelect(doc?doc.header:null);if(!doc){$('#soDate').val(new Date().toISOString().slice(0,10));$('#soStatus').val('Open');google.script.run.withSuccessHandler(id=>$('#soID').val(id)).withFailureHandler(e=>alert('Unable to generate SO ID: '+(e.message||e))).Document_generateID('SalesOrder')}else loadEditor(doc)}).withFailureHandler(e=>alert('Failed to load customers: '+(e.message||e))).soGetCustomers()}
function loadEditor(doc){const h=doc.header;$('#soID').val(h['SO ID']||'');$('#soDate').val(h['SO Date']?String(h['SO Date']).slice(0,10):'');$('#soInvoice').val(h['Invoice Num']||'');$('#soCustomer').val(h['Customer ID']).trigger('change');$('#soStatus').val(h['SO Status']||'Open');(doc.details?.SalesDetails||[]).forEach(addLine);recalcTotal()}
function addLine(existing){const tb=document.querySelector('#soLines tbody'),tr=document.createElement('tr'),detailID=existing?existing['Detail ID']:nextDetailID();tr.innerHTML=`<td class="detailID">${esc(detailID)}</td><td><select class="item" style="width:180px"></select></td><td class="itemID"></td><td><input class="qty" type="number" min="0" step="1" value="${existing?Number(existing['QTY Ordered'])||0:1}"></td><td><input class="delivered readonly" type="number" readonly value="${existing?Number(existing['QTY Delivered'])||0:0}"></td><td class="balance">0</td><td><input class="price" type="number" step="0.01" value="${existing?Number(existing['Unit Price'])||0:0}"></td><td class="excl">0.00</td><td><input class="taxRate" type="number" step="0.01" value="${existing?Number(existing['Tax Rate'])||0:0}"></td><td class="tax">0.00</td><td class="incl">0.00</td><td><input class="ship" type="number" step="0.01" value="${existing?Number(existing['Shipping Fees'])||0:0}"></td><td class="lineTotal">0.00</td><td><span class="danger" onclick="removeLine(this)">×</span></td>`;tb.appendChild(tr);const s=$(tr.querySelector('.item'));soInventory.forEach(i=>s.append(new Option(i['Item Name'],i['Item ID'],false,false)));s.select2({placeholder:'Item Name',width:'180px'}).on('change',function(){const item=soInventory.find(i=>String(i['Item ID'])===String(this.value));if(item){tr.querySelector('.itemID').textContent=item['Item ID'];recalcLine(tr)}});if(existing)s.val(existing['Item ID']).trigger('change');['.qty','.price','.taxRate','.ship'].forEach(sel=>tr.querySelector(sel).addEventListener('input',()=>recalcLine(tr)));recalcLine(tr)}
function nextDetailID(){const so=$('#soID').val();let max=0;document.querySelectorAll('#soLines tbody tr .detailID').forEach(e=>{const m=String(e.textContent).match(new RegExp('^'+so+'-(\\d+)$'));if(m)max=Math.max(max,Number(m[1]))});return so+'-'+String(max+1).padStart(2,'0')}
function removeLine(el){el.closest('tr').remove();recalcTotal()}
function recalcLine(tr){const q=Number(tr.querySelector('.qty').value)||0,d=Number(tr.querySelector('.delivered').value)||0,p=Number(tr.querySelector('.price').value)||0,t=Number(tr.querySelector('.taxRate').value)||0,s=Number(tr.querySelector('.ship').value)||0,excl=q*p,tax=excl*t/100,incl=excl+tax;tr.querySelector('.balance').textContent=Math.max(0,q-d).toFixed(0);tr.querySelector('.excl').textContent=excl.toFixed(2);tr.querySelector('.tax').textContent=tax.toFixed(2);tr.querySelector('.incl').textContent=incl.toFixed(2);tr.querySelector('.lineTotal').textContent=(incl+s).toFixed(2);recalcTotal()}
function recalcTotal(){let total=0,ordered=0,delivered=0;document.querySelectorAll('#soLines tbody tr').forEach(tr=>{total+=Number(tr.querySelector('.lineTotal').textContent)||0;ordered+=Number(tr.querySelector('.qty').value)||0;delivered+=Number(tr.querySelector('.delivered').value)||0});$('#soTotal').val(total.toFixed(2));let status='Open';if(ordered>0&&delivered>0&&delivered<ordered)status='Partially Fulfilled';if(ordered>0&&delivered>=ordered)status='Fulfilled';$('#soStatus').val(status);return{total,status}}
function buildPayload(){const v=recalcTotal(),master={'SO Date':$('#soDate').val(),'SO ID':$('#soID').val(),'Customer ID':$('#soCustomerID').val(),'Customer Name':$('#soCustomer option:selected').text(),'Invoice Num':$('#soInvoice').val(),'State':$('#soState').val(),'City':$('#soCity').val(),'Total SO Amount':v.total,'SO Status':v.status},details=[];document.querySelectorAll('#soLines tbody tr').forEach(tr=>{const item=soInventory.find(i=>String(i['Item ID'])===String(tr.querySelector('.itemID').textContent)),q=Number(tr.querySelector('.qty').value)||0,d=Number(tr.querySelector('.delivered').value)||0,p=Number(tr.querySelector('.price').value)||0,t=Number(tr.querySelector('.taxRate').value)||0,s=Number(tr.querySelector('.ship').value)||0,excl=q*p,tax=excl*t/100,incl=excl+tax;details.push({'SO Date':master['SO Date'],'SO ID':master['SO ID'],'Detail ID':tr.querySelector('.detailID').textContent,'Customer ID':master['Customer ID'],'Customer Name':master['Customer Name'],'State':master['State'],'City':master['City'],'Invoice Num':master['Invoice Num'],'Item ID':item?item['Item ID']:'','Item Type':item?item['Item Type']:'','Item Category':item?item['Item Category']:'','Item Subcategory':item?item['Item Subcategory']:'','Item Name':item?item['Item Name']:'','QTY Ordered':q,'QTY Delivered':d,'QTY Balance':Math.max(0,q-d),'Unit Price':p,'Price Excl Tax':excl,'Tax Rate':t,'Total Tax':tax,'Price Incl Tax':incl,'Shipping Fees':s,'Total Sales Price':incl+s})});return{type:'SalesOrder',master,details:{SalesDetails:details}}}
function saveSO(){const p=buildPayload();if(!p.master['SO ID'])return alert('Sales Order ID is required.');if(!p.master['Customer ID'])return alert('Please select a customer.');if(!p.details.SalesDetails.length)return alert('At least one detail line is required.');if(p.details.SalesDetails.some(x=>!x['Item ID']))return alert('Every detail line must have an item.');if(p.details.SalesDetails.some(x=>x['QTY Ordered']<=0))return alert('QTY Ordered must be greater than zero.');showProcessing(true);google.script.run.withSuccessHandler(r=>{showProcessing(false);closeModal();loadSOList();let msg=currentMode==='edit'?'Sales Order updated successfully.':'Sales Order saved successfully.';if(r?.inventoryWarnings?.length)msg+='\n\nInventory warning(s):\n'+r.inventoryWarnings.join('\n');alert(msg)}).withFailureHandler(e=>{showProcessing(false);alert('Sales Order save failed:\n\n'+(e.message||e))}).soSaveSalesOrder(p)}
function editSO(id){showProcessing(true);google.script.run.withSuccessHandler(doc=>{showProcessing(false);if(!doc)return alert('Sales Order not found: '+id);openEditor(doc)}).withFailureHandler(e=>{showProcessing(false);alert('Failed to load Sales Order:\n\n'+(e.message||e))}).Document_get('SalesOrder',id)}
function deleteSO(id){if(!confirm('Delete Sales Order '+id+'?'))return;showProcessing(true);google.script.run.withSuccessHandler(()=>{showProcessing(false);loadSOList();alert('Sales Order deleted successfully.')}).withFailureHandler(e=>{showProcessing(false);alert('Delete failed:\n\n'+(e.message||e))}).soDeleteSalesOrder(id)}
document.addEventListener('DOMContentLoaded',()=>{google.script.run.withSuccessHandler(d=>soInventory=d||[]).withFailureHandler(e=>console.error(e)).soGetInventoryItems();loadSOList();document.getElementById('soBtnNewSO').onclick=()=>openEditor(null);document.getElementById('soBtnSearch').onclick=applySearch;document.getElementById('soBtnClear').onclick=()=>{document.getElementById('soSearchInput').value='';document.getElementById('soSearchCriteria').value='All';renderSOList(soAllData)}});
</script>
<?!= include('DocumentRenderer'); ?>
</body>
</html>
